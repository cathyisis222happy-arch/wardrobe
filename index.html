<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#faf9f6">
  <title>我的衣橱</title>
  <link rel="manifest" href="data:application/json,{}">
  <style>
    :root {
      --bg: #faf9f6;
      --card: #fff;
      --text: #33302e;
      --text-secondary: #8a8580;
      --accent: #9b7b5c;
      --accent-light: #f5f1eb;
      --accent-soft: #faf7f3;
      --border: #e8e4df;
      --shadow: 0 1px 4px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
      --radius: 14px;
      --radius-sm: 10px;
      --font: -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{
      font-family:var(--font);
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -webkit-tap-highlight-color:transparent;
    }
    #app{max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column}

    /* Header */
    .header{
      padding:16px 20px 12px;
      display:flex;align-items:center;justify-content:space-between;
      font-size:18px;font-weight:600;color:var(--text);
    }
    .header-action{background:none;border:none;color:var(--text-secondary);font-size:14px;padding:4px}

    /* Pages */
    .pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 90px}
    .page{display:none}
    .page.active{display:block}

    /* Bottom Nav */
    .bottom-nav{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:100%;max-width:480px;background:var(--card);
      border-top:1px solid var(--border);
      display:flex;justify-content:space-around;padding:8px 0;
      padding-bottom:max(8px,env(safe-area-inset-bottom));
      z-index:20;
    }
    .nav-item{
      display:flex;flex-direction:column;align-items:center;gap:2px;
      background:none;border:none;font-size:11px;color:var(--text-secondary);
      padding:4px 16px;cursor:pointer;transition:color .2s;
    }
    .nav-item .icon{font-size:22px}
    .nav-item.active{color:var(--accent);font-weight:600}

    /* Buttons */
    .btn-primary{
      background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
      padding:13px 24px;font-size:15px;font-weight:600;cursor:pointer;width:100%;
      transition:all .2s;
    }
    .btn-primary:active{opacity:.85;transform:scale(.98)}
    .btn-outline{
      background:var(--card);color:var(--accent);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);padding:10px 18px;font-size:13px;cursor:pointer;
    }
    .btn-outline:active{background:var(--accent-soft)}

    /* Chips */
    .chip-row{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      background:var(--card);border:1.5px solid var(--border);border-radius:20px;
      padding:8px 16px;font-size:13px;cursor:pointer;transition:all .2s;user-select:none;
    }
    .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .chip.auto{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}

    /* Cards */
    .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}

    /* Today's Outfit Log */
    .outfit-photo{
      width:100%;border-radius:var(--radius);overflow:hidden;background:var(--accent-soft);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      cursor:pointer;min-height:280px;position:relative;
    }
    .outfit-photo img{width:100%;display:block}
    .outfit-photo .placeholder{text-align:center;color:var(--text-secondary);padding:40px}
    .outfit-photo .placeholder-icon{font-size:40px;margin-bottom:8px}
    .outfit-photo .placeholder-text{font-size:14px}
    .section-label{
      font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;
      letter-spacing:1px;margin-bottom:8px;margin-top:16px;
    }
    .weather-strip{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-secondary);padding:8px 0}
    .weather-strip .temp{font-size:20px;font-weight:600;color:var(--text)}

    /* Linked items */
    .linked-items{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
    .linked-item{
      width:56px;height:56px;border-radius:var(--radius-sm);overflow:hidden;
      flex-shrink:0;border:2px solid transparent;cursor:pointer;background:var(--accent-soft);
    }
    .linked-item img{width:100%;height:100%;object-fit:cover}
    .linked-item.selected{border-color:var(--accent)}

    /* Calendar */
    .calendar-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .calendar-nav .month{font-size:18px;font-weight:600}
    .calendar-nav button{background:none;border:none;font-size:20px;color:var(--accent);cursor:pointer;padding:8px}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
    .calendar-grid .day-header{font-size:11px;color:var(--text-secondary);padding:8px 0;font-weight:500}
    .calendar-grid .day-cell{
      aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
      justify-content:center;font-size:14px;border-radius:50%;cursor:pointer;
      position:relative;
    }
    .calendar-grid .day-cell.other-month{color:#d0ccc8}
    .calendar-grid .day-cell.today{background:var(--accent-soft);font-weight:600}
    .calendar-grid .day-cell.has-outfit::after{
      content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);
      position:absolute;bottom:6px;
    }
    .calendar-grid .day-cell .thumb{
      width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;
    }
    .calendar-grid .day-cell .day-num{z-index:1;font-size:10px;font-weight:600;
      background:var(--accent);color:#fff;padding:2px 4px;border-radius:8px;position:absolute;top:2px;right:2px;
    }
    .calendar-grid .day-cell .day-num-plain{z-index:1;font-size:13px}

    /* Wardrobe */
    .wardrobe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .wardrobe-item{
      aspect-ratio:3/4;border-radius:var(--radius-sm);overflow:hidden;
      background:var(--accent-soft);cursor:pointer;position:relative;
    }
    .wardrobe-item img{width:100%;height:100%;object-fit:cover}
    .wardrobe-item .item-label{
      position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.45);
      color:#fff;font-size:11px;padding:4px;text-align:center;
    }
    .wardrobe-item .item-tick{
      position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;
      width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:12px;display:none;
    }
    .wardrobe-item.pick-mode .item-tick{display:flex}
    .wardrobe-item.picked .item-tick{display:flex;background:#5a8}
    .wardrobe-item .item-tick::after{content:'✓'}

    /* Suggestion */
    .suggestion-card{
      background:var(--accent-soft);border-radius:var(--radius-sm);
      padding:12px 16px;margin-bottom:8px;font-size:14px;color:var(--accent);
      display:flex;align-items:center;gap:8px;
    }
    .tomorrow-card{
      background:var(--card);border-radius:var(--radius);padding:16px;
      margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);
    }
    .tomorrow-card .tomorrow-header{
      display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
    }
    .tomorrow-card .tomorrow-header .label{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
    .tomorrow-card .tomorrow-weather{display:flex;align-items:center;gap:8px;font-size:15px}
    .tomorrow-card .tomorrow-weather .temp{font-size:24px;font-weight:700}
    .tomorrow-card .tomorrow-weather .range{font-size:13px;color:var(--text-secondary)}
    .tomorrow-suggestions{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
    .tomorrow-suggestions .suggestion-outfit{
      display:flex;gap:4px;flex-shrink:0;background:var(--accent-soft);
      border-radius:var(--radius-sm);padding:8px;
    }
    .tomorrow-suggestions .suggestion-outfit .si-item{
      width:48px;height:48px;border-radius:8px;overflow:hidden;background:var(--card);
    }
    .tomorrow-suggestions .suggestion-outfit .si-item img{width:100%;height:100%;object-fit:cover}

    /* Modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center}
    .modal-overlay.show{display:flex}
    .modal{
      background:var(--card);border-radius:var(--radius) var(--radius) 0 0;
      width:100%;max-width:480px;max-height:85vh;overflow-y:auto;
      padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
    }
    .modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
    .modal-actions{display:flex;gap:10px;margin-top:16px}

    /* Outfit Detail Modal */
    .detail-photo{width:100%;border-radius:var(--radius-sm);margin-bottom:12px}
    .detail-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
    .detail-tag{background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:12px;font-size:12px}
    .detail-section{margin-top:12px}

    /* Colors for mood */
    .mood-happy{background:#f5f1eb}
    .mood-ok{background:#e8e4df}
    .mood-tired{background:#ddd}
    .mood-chic{background:#f0e8e0}
    .mood-calm{background:#e8efe4}

    /* Toast */
    .toast{
      position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
      background:#333;color:#fff;padding:10px 20px;border-radius:20px;
      font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;
    }
    .toast.show{opacity:1}

    /* Empty */
    .empty{text-align:center;padding:40px 20px;color:var(--text-secondary)}
    .empty .emoji{font-size:48px;margin-bottom:12px}
    .empty p{font-size:14px;line-height:1.6}

    /* Inspiration gallery */
    .inspo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .inspo-card{border-radius:var(--radius-sm);overflow:hidden;background:var(--card);box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--border)}
    .inspo-card .inspo-img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
    .inspo-card .inspo-info{padding:8px 10px}
    .inspo-card .inspo-date{font-size:11px;color:var(--text-secondary)}
    .inspo-card .inspo-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
    .inspo-card .inspo-tags span{font-size:10px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:10px}
    .divider{height:1px;background:var(--border);margin:20px 0}
  </style>
</head>
<body>
<div id="app">
  <div class="header"><span id="headerTitle">今日穿搭</span></div>
  <div class="pages">

    <!-- TAB: 记录 -->
    <div class="page active" id="page-log">
      <div class="tomorrow-card" id="tomorrowCard"></div>
      <div class="suggestion-card" id="suggestion"></div>
      <div class="outfit-photo" id="outfitPhoto">
        <div class="placeholder"><div class="placeholder-icon">📸</div><div class="placeholder-text">记录今日穿搭</div></div>
      </div>
      <input type="file" accept="image/*" id="fileOutfit" style="display:none">
      <div class="weather-strip" id="weatherStrip">🌤️ 获取天气中…</div>
      <div class="section-label">场合</div>
      <div class="chip-row" id="occasionChips"></div>
      <div class="section-label">心情</div>
      <div class="chip-row" id="moodChips"></div>
      <div class="section-label" id="itemsLabel">今日单品（可选）</div>
      <div class="linked-items" id="linkedItems"></div>
      <button class="btn-primary" id="btnSaveOutfit" style="margin-top:20px">保存记录</button>
      <div style="height:20px"></div>
    </div>

    <!-- TAB: 日历 -->
    <div class="page" id="page-calendar">
      <div class="calendar-nav">
        <button id="btnPrevMonth">‹</button>
        <span class="month" id="monthLabel"></span>
        <button id="btnNextMonth">›</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="divider"></div>
      <div class="section-label">✨ 灵感池</div>
      <div class="inspo-grid" id="inspoGrid"></div>
      <div id="calendarEmpty" class="empty" style="display:none"><p>暂无记录</p></div>
    </div>

    <!-- TAB: 衣橱 -->
    <div class="page" id="page-wardrobe">
      <div class="section-label" style="margin-top:0">分类</div>
      <div class="chip-row" id="wardrobeFilterChips"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px">
        <span style="font-size:13px;color:var(--text-secondary)" id="wardrobeCount"></span>
        <button class="btn-outline" style="font-size:12px;padding:6px 14px" id="btnWardrobeAdd">+ 添加</button>
      </div>
      <div class="wardrobe-grid" id="wardrobeGrid"></div>
      <div class="empty" id="wardrobeEmpty"><div class="emoji">👗</div><p>衣橱还空着<br>点右上角添加第一件衣服</p></div>
    </div>

  </div>

  <div class="bottom-nav">
    <button class="nav-item active" data-tab="log"><span class="icon">📸</span>记录</button>
    <button class="nav-item" data-tab="calendar"><span class="icon">📅</span>日历</button>
    <button class="nav-item" data-tab="wardrobe"><span class="icon">👗</span>衣橱</button>
  </div>
</div>

<!-- Outfit Detail Modal -->
<div class="modal-overlay" id="outfitDetailModal">
  <div class="modal" id="outfitDetailContent"></div>
</div>

<!-- Add Item Modal -->
<div class="modal-overlay" id="addItemModal">
  <div class="modal">
    <h3 id="addItemTitle">添加单品</h3>
    <input type="file" accept="image/*" id="fileItem" style="display:none">
    <div class="outfit-photo" id="itemPreview" style="min-height:180px">
      <div class="placeholder"><div class="placeholder-icon">📷</div><div class="placeholder-text">点击拍照或选图</div></div>
    </div>
    <div class="section-label" style="margin-top:12px">类别</div>
    <div class="chip-row" id="itemCatChips"></div>
    <div class="section-label">颜色 <span style="font-size:11px;color:var(--accent);font-weight:400" id="itemColorHint"></span></div>
    <div class="chip-row" id="itemColorChips"></div>
    <div class="section-label">季节（可选）</div>
    <div class="chip-row" id="itemSeasonChips"></div>
    <div class="modal-actions">
      <button class="btn-outline" style="flex:1" id="btnItemCancel">取消</button>
      <button class="btn-primary" style="flex:1" id="btnItemSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── DB ───
const DB='wardrobe_v2',DBV=1;
let db;
function opendb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,DBV);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('clothes')){const s=d.createObjectStore('clothes',{keyPath:'id',autoIncrement:true});s.createIndex('category','category')}if(!d.objectStoreNames.contains('outfits')){const s=d.createObjectStore('outfits',{keyPath:'id',autoIncrement:true});s.createIndex('date','date')}};r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=()=>no(r.error)})}
function dbAdd(store,item){return new Promise((ok,no)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).add(item);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbPut(store,item){return new Promise((ok,no)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).put(item);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbGetAll(store){return new Promise((ok,no)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbGetByIndex(store,idx,val){return new Promise((ok,no)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).index(idx).getAll(val);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbGet(store,id){return new Promise((ok,no)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbDelete(store,id){return new Promise((ok,no)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).delete(id);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}

// ─── State ───
let clothes=[],outfits=[],outfitsByDate={};
let todayStr=new Date().toISOString().slice(0,10);
let weather=null,currentTab='log';
let outfitImage=null,todayOutfit=null, tomorrowWeather=null;
let selectedOccasion='',selectedMood='',selectedItemIds=[];
let calendarMonth=new Date().getMonth(),calendarYear=new Date().getFullYear();

// Item form state
let itemImage=null,itemCat='',itemColor='',itemSeason='',itemDetectedColor='',itemEditingId=null;

const CATEGORIES={top:'上衣',bottom:'下装',dress:'连衣裙',outerwear:'外套',shoes:'鞋子',accessory:'配饰'};
const CAT_ICONS={top:'👚',bottom:'👖',dress:'👗',outerwear:'🧥',shoes:'👟',accessory:'👜'};
const CAT_CHIPS=Object.entries(CATEGORIES).map(([id,label])=>({id,label:CAT_ICONS[id]+' '+label}));
const OCCASIONS=['💼 上班','☕ 休闲','🌹 约会','🏃 运动','🎉 正式'];
const MOODS=[
  {emoji:'😊',label:'开心',cls:'mood-happy'},
  {emoji:'😐',label:'还行',cls:'mood-ok'},
  {emoji:'😴',label:'疲惫',cls:'mood-tired'},
  {emoji:'✨',label:'精致',cls:'mood-chic'},
  {emoji:'🌿',label:'悠闲',cls:'mood-calm'},
];
const SEASONS=['🌱 春','☀️ 夏','🍂 秋','❄️ 冬'];
const COLORS=[
  {label:'⚫ 黑色',r:40,g:40,b:40},{label:'⚪ 白色',r:240,g:240,b:240},
  {label:'🩶 灰色',r:150,g:150,b:150},{label:'🔵 蓝色',r:90,g:140,b:200},
  {label:'🟤 棕色',r:155,g:110,b:80},{label:'🟢 绿色',r:105,g:165,b:105},
  {label:'🔴 红色',r:215,g:80,b:80},{label:'🩷 粉色',r:240,g:160,b:180},
  {label:'🟡 黄色',r:230,g:200,b:95},{label:'🟣 紫色',r:175,g:155,b:215},
];

// ─── Helpers ───
function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),2000)}
function fmtDate(d){return d.toISOString().slice(0,10)}
function suggestion(temp){
  if(temp==null)return null;
  if(temp<=5)return '羽绒服 + 厚毛衣 + 围巾';
  if(temp<=12)return '厚外套 + 毛衣';
  if(temp<=18)return '薄外套 + 长袖衬衫';
  if(temp<=24)return '长袖T恤 + 薄裤';
  if(temp<=28)return '短袖 + 薄长裤 / 裙';
  if(temp<=32)return '清凉上衣 + 短裤 / 短裙';
  return '背心 + 轻薄下装，注意防晒';
}

// ─── Tab Switching ───
function switchTab(tab){
  currentTab=tab;
  $$('.page').forEach(p=>p.classList.remove('active'));
  $(`#page-${tab}`).classList.add('active');
  $$('.nav-item').forEach(n=>n.classList.remove('active'));
  $(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  $('#headerTitle').textContent=tab==='log'?'今日穿搭':tab==='calendar'?'穿搭日历':'衣橱';
  if(tab==='log')renderLog();
  if(tab==='calendar')renderCalendar();
  if(tab==='wardrobe')renderWardrobe();
}

// ─── Log Tab ───
async function renderLog(){
  const dateStr=todayStr;
  const todays=outfits.filter(o=>o.date===dateStr);
  todayOutfit=todays.length?todays[0]:null;

  if(todayOutfit){
    $('#outfitPhoto').innerHTML=`<img src="${todayOutfit.image}" alt="">`;
    selectedOccasion=todayOutfit.occasion||'';
    selectedMood=todayOutfit.mood||'';
    selectedItemIds=todayOutfit.itemIds||[];
    $('#btnSaveOutfit').textContent='更新记录';
  }else{
    outfitImage=null;
    $('#outfitPhoto').innerHTML='<div class="placeholder"><div class="placeholder-icon">📸</div><div class="placeholder-text">记录今日穿搭</div></div>';
    selectedOccasion='';selectedMood='';selectedItemIds=[];
    $('#btnSaveOutfit').textContent='保存记录';
  }
  renderOccasionChips();
  renderMoodChips();
  renderLinkedItems();
  renderWeather();
  renderSuggestion();
  renderTomorrow();
}

function renderOccasionChips(){
  const el=$('#occasionChips');
  el.innerHTML=OCCASIONS.map(o=>`<span class="chip${selectedOccasion===o?' active':''}" data-val="${o}">${o}</span>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{selectedOccasion=c.dataset.val===selectedOccasion?'':c.dataset.val;renderOccasionChips()}));

function getTomorrowCombos(temp){
  if(clothes.length===0)return[];
  // Score clothes by temperature suitability
  const tempRanges={cold:12, cool:18, mild:24, warm:28, hot:35};
  let season='春';
  if(temp<=12)season='冬';else if(temp<=18)season='秋';else if(temp<=28)season='春';else season='夏';

  const scored=clothes.map(c=>{
    let s=0;
    if(c.season&&c.season.includes(season))s+=3;
    if(temp<=12&&(c.category==='outerwear'||c.category==='top'))s+=2;
    if(temp>24&&(c.category==='dress'||c.category==='bottom'))s+=2;
    return{...c,score:s};
  }).sort((a,b)=>b.score-a.score);

  const tops=scored.filter(c=>c.category==='top').slice(0,3);
  const outers=scored.filter(c=>c.category==='outerwear').slice(0,2);
  const bottoms=scored.filter(c=>c.category==='bottom').slice(0,3);
  const dresses=scored.filter(c=>c.category==='dress').slice(0,2);
  const shoes=scored.filter(c=>c.category==='shoes').slice(0,1);

  const combos=[];
  // Combo 1: top + bottom (+ outer if cold)
  if(tops[0]&&bottoms[0]){
    const combo=[tops[0],bottoms[0]];
    if(outers[0]&&temp<=18)combo.unshift(outers[0]);
    if(shoes[0])combo.push(shoes[0]);
    combos.push(combo);
  }
  // Combo 2: dress
  if(dresses[0]){
    const combo=[dresses[0]];
    if(outers[0]&&temp<=18)combo.unshift(outers[0]);
    if(shoes[0])combo.push(shoes[0]);
    combos.push(combo);
  }
  // Combo 3: different top + bottom
  if(tops[1]&&bottoms[1]){
    const combo=[tops[1],bottoms[1]];
    if(shoes[0])combo.push(shoes[0]);
    combos.push(combo);
  }
  return combos;
}

function renderCalendar(){
  const year=calendarYear,month=calendarMonth;
  $('#monthLabel').textContent=`${year}年${month+1}月`;

  const firstDay=new Date(year,month,1).getDay(); // 0=Sun
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayNow=new Date();

  let html='<div class="day-header">日</div><div class="day-header">一</div><div class="day-header">二</div><div class="day-header">三</div><div class="day-header">四</div><div class="day-header">五</div><div class="day-header">六</div>';

  // Prev month fill
  const prevDays=new Date(year,month,0).getDate();
  for(let i=firstDay-1;i>=0;i--){
    const d=prevDays-i;
    html+=`<div class="day-cell other-month">${d}</div>`;
  }

  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=year===todayNow.getFullYear()&&month===todayNow.getMonth()&&d===todayNow.getDate();
    const outfit=outfitsByDate[dateStr];
    let cls='day-cell';
    if(isToday)cls+=' today';
    if(outfit)cls+=' has-outfit';

    let inner=`<span class="day-num-plain">${d}</span>`;
    if(outfit){
      inner=`<img class="thumb" src="${outfit.image}" alt=""><span class="day-num">${d}</span>`;
    }
    html+=`<div class="${cls}" data-date="${dateStr}">${inner}</div>`;
  }

  // Fill remaining cells
  const totalCells=firstDay+daysInMonth;
  const remaining=totalCells%7===0?0:7-(totalCells%7);
  for(let i=1;i<=remaining;i++){html+=`<div class="day-cell other-month">${i}</div>`}

  $('#calendarGrid').innerHTML=html;

  // Click handlers
  $$('#calendarGrid .day-cell:not(.other-month)').forEach(cell=>{
    cell.addEventListener('click',()=>{
      const date=cell.dataset.date;
      if(date&&outfitsByDate[date])showOutfitDetail(outfitsByDate[date]);
    });
  });
  renderInspo();
}

function detectItemColor(imgEl){
  if(!imgEl)return;
  const cnv=document.createElement('canvas'),ctx=cnv.getContext('2d');
  const sz=40;cnv.width=sz;cnv.height=sz;
  const sx=(imgEl.naturalWidth||imgEl.width)*.3,sy=(imgEl.naturalHeight||imgEl.height)*.2;
  const sw=(imgEl.naturalWidth||imgEl.width)*.4,sh=(imgEl.naturalHeight||imgEl.height)*.4;
  ctx.drawImage(imgEl,sx,sy,sw,sh,0,0,sz,sz);
  const d=ctx.getImageData(0,0,sz,sz).data;let r=0,g=0,b=0,ct=0;
  for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];ct++}
  r=Math.round(r/ct);g=Math.round(g/ct);b=Math.round(b/ct);
  let best=COLORS[0],bd=Infinity;
  for(const c of COLORS){const dr=r-c.r,dg=g-c.g,db=b-c.b,dist=dr*dr+dg*dg+db*db;if(dist<bd){bd=dist;best=c}}
  itemDetectedColor=best.label;
  if(!itemColor&&!itemEditingId)itemColor=best.label;
  $('#itemColorHint').textContent=`→ ${best.label}`;
  renderItemColorChips();
}

async function reloadAll(){
  clothes=await dbGetAll('clothes');
  outfits=await dbGetAll('outfits');

  outfits.forEach(o=>{outfitsByDate[o.date]=o});
  outfits.sort((a,b)=>b.date.localeCompare(a.date));
  if(currentTab==='log')renderLog();
  if(currentTab==='calendar'){renderCalendar();renderInspo()}
  if(currentTab==='wardrobe')renderWardrobe();
}

// ─── Weather Fetch ───
async function fetchWeather(){
  try{
    const pos=await new Promise((ok,no)=>{navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),()=>ok(null),{timeout:5000})});
    if(!pos)return;
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.lat}&longitude=${pos.lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&forecast_days=2&timezone=auto`);
    const d=await r.json();
    if(d.current_weather){weather=d.current_weather;renderWeather();renderSuggestion()}
    if(d.daily&&d.daily.time&&d.daily.time.length>=2){
      tomorrowWeather={
        date:d.daily.time[1],
        max:d.daily.temperature_2m_max[1],
        min:d.daily.temperature_2m_min[1],
        weathercode:d.daily.weathercode[1],
      };
      renderTomorrow();
    }
  }catch(e){}
}

// ─── Init ───
async function init(){
  await opendb();
  await reloadAll();
  fetchWeather();

  // Nav
  $$('.nav-item').forEach(n=>n.addEventListener('click',()=>switchTab(n.dataset.tab)));

  // Outfit photo
  $('#outfitPhoto').addEventListener('click',()=>{
    if(todayOutfit)return; // already logged — could add edit later
    $('#fileOutfit').click();
  });
  $('#fileOutfit').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const mw=1200;const s=Math.min(1,mw/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);outfitImage=c.toDataURL('image/jpeg',.85);$('#outfitPhoto').innerHTML=`<img src="${outfitImage}" alt="">`};img.src=reader.result};reader.readAsDataURL(f);
  });

  // Save outfit
  $('#btnSaveOutfit').addEventListener('click',async()=>{
    const img=todayOutfit?todayOutfit.image:outfitImage;
    if(!img){toast('请先拍照');return}
    const w=weather?`${Math.round(weather.temperature)}°C`:'';
    const item={date:todayStr,image:img,weather:w,weatherCode:weather?weather.weathercode:null,occasion:selectedOccasion,mood:selectedMood,itemIds:selectedItemIds,createdAt:Date.now()};
    if(todayOutfit){item.id=todayOutfit.id;await dbPut('outfits',item)}else{await dbAdd('outfits',item)}
    await reloadAll();
    toast(todayOutfit?'已更新':'已保存');
    renderLog();
  });

  // Calendar nav
  $('#btnPrevMonth').addEventListener('click',()=>{
    calendarMonth--;if(calendarMonth<0){calendarMonth=11;calendarYear--}renderCalendar();
  });
  $('#btnNextMonth').addEventListener('click',()=>{
    const now=new Date();
    if(calendarYear===now.getFullYear()&&calendarMonth===now.getMonth())return;
    calendarMonth++;if(calendarMonth>11){calendarMonth=0;calendarYear++}renderCalendar();
  });

  // Wardrobe add
  $('#btnWardrobeAdd').addEventListener('click',()=>openItemForm('添加单品'));

  // Item modal: photo
  $('#itemPreview').addEventListener('click',()=>$('#fileItem').click());
  $('#fileItem').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;const reader=new FileReader();
    reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const mw=800;const s=Math.min(1,mw/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);itemImage=c.toDataURL('image/jpeg',.8);$('#itemPreview').innerHTML=`<img src="${itemImage}" alt="">`;const pImg=$('#itemPreview').querySelector('img');if(pImg)detectItemColor(pImg)};img.src=reader.result};reader.readAsDataURL(f);
  });

  // Item save
  $('#btnItemSave').addEventListener('click',async()=>{
    if(!itemImage){toast('请先拍照');return}if(!itemCat){toast('请选择类别');return}
    const it={image:itemImage,category:itemCat,color:itemColor,season:itemSeason,createdAt:Date.now()};
    if(itemEditingId){it.id=itemEditingId;await dbPut('clothes',it)}else{await dbAdd('clothes',it)}
    document.getElementById('addItemModal').classList.remove('show');
    await reloadAll();toast(itemEditingId?'已更新':'已添加');
  });

  // Item cancel
  $('#btnItemCancel').addEventListener('click',()=>{$('#addItemModal').classList.remove('show')});
  $('#addItemModal').addEventListener('click',e=>{if(e.target===$('#addItemModal'))$('#addItemModal').classList.remove('show')});
  $('#outfitDetailModal').addEventListener('click',e=>{if(e.target===$('#outfitDetailModal'))$('#outfitDetailModal').classList.remove('show')});
}

document.addEventListener('DOMContentLoaded',init);
